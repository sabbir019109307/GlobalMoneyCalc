name: Site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required pages, metadata, local links and JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const required = [
            'index.html',
            'currency-rates.html',
            'rates.html',
            'guides.html',
            'advertise.html',
            'privacy.html',
            'terms.html',
            '404.html',
            'favicon.svg',
            'robots.txt',
            'sitemap.xml',
            'analytics.js',
            'ANALYTICS-SETUP-BN.md'
          ];

          const errors = [];
          for (const file of required) {
            if (!fs.existsSync(file)) errors.push('Missing required file: ' + file);
          }

          for (const file of required.filter((name) => name.endsWith('.html'))) {
            if (!fs.existsSync(file)) continue;
            const html = fs.readFileSync(file, 'utf8');

            if (!/<title>[^<]+<\/title>/i.test(html)) {
              errors.push(file + ': missing page title');
            }
            if (file !== '404.html' && !/<meta\s+name=["']description["']/i.test(html)) {
              errors.push(file + ': missing meta description');
            }

            const refs = [...html.matchAll(/(?:href|src)=["']([^"']+)["']/gi)];
            for (const match of refs) {
              const ref = match[1].trim();
              if (!ref || ref.startsWith('#') || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(ref)) continue;
              const clean = decodeURIComponent(ref.split(/[?#]/, 1)[0]);
              if (!clean) continue;
              const target = path.resolve(path.dirname(file), clean);
              const candidates = [target, path.join(target, 'index.html')];
              if (!candidates.some((candidate) => fs.existsSync(candidate))) {
                errors.push(file + ': broken local link or asset: ' + ref);
              }
            }

            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
            for (let i = 0; i < scripts.length; i++) {
              const attrs = scripts[i][1];
              const code = scripts[i][2];
              if (/\bsrc\s*=/.test(attrs)) continue;
              const type = (attrs.match(/\btype\s*=\s*["']([^"']+)["']/i) || [])[1] || 'text/javascript';
              if (!/^(?:text|application)\/(?:java|ecma)script$|^module$/i.test(type)) continue;
              try {
                new Function(code);
              } catch (error) {
                errors.push(file + ': inline script ' + (i + 1) + ' has a syntax error: ' + error.message);
              }
            }
          }

          const home = fs.readFileSync('index.html', 'utf8');
          const chart = fs.readFileSync('currency-rates.html', 'utf8');
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const analytics = fs.readFileSync('analytics.js', 'utf8');

          if (!analytics.includes('const MEASUREMENT_ID = "";')) errors.push('analytics.js: analytics must remain disabled until owner adds a real GA4 Measurement ID');
          if (!analytics.includes('gmc_ga4_consent_v1') || !analytics.includes('Allow analytics')) errors.push('analytics.js: missing explicit visitor consent flow');
          for (const file of required.filter((name) => name.endsWith('.html'))) {
            if (fs.existsSync(file) && !fs.readFileSync(file, 'utf8').includes('src="analytics.js"')) errors.push(file + ': missing optional analytics loader');
          }
          if (!home.includes('currency-rates.html')) errors.push('index.html: missing currency-rate chart link');
          if (!home.includes('Rates by Exchangerate.dev') || !home.includes('https://exchangerate.dev')) {
            errors.push('index.html: missing required visible provider credit link');
          }
          if (!chart.includes('function setText()')) errors.push('currency-rates.html: missing language text function');
          if (!chart.includes('globalmoneycalc_shared_rates_')) errors.push('currency-rates.html: missing shared browser cache');
          if (!chart.includes('rel="canonical"')) errors.push('currency-rates.html: missing canonical URL');
          if (!home.includes('globalmoneycalc_shared_rates_USD')) errors.push('index.html: missing shared browser cache key');
          if (!home.includes('window.setInterval(loadDailyRates,RATE_REFRESH_MS+5000)')) {
            errors.push('index.html: missing periodic exchange-rate refresh');
          }
          if (!chart.includes('window.setInterval(load,15*60*1000+5000)')) {
            errors.push('currency-rates.html: missing periodic exchange-rate refresh');
          }
          if (!chart.includes('https://api.exchangerate.dev/v1/latest/USD')) {
            errors.push('currency-rates.html: missing USD-based rate endpoint');
          }
          if (!chart.includes('Rates by Exchangerate.dev') || !chart.includes('https://exchangerate.dev')) {
            errors.push('currency-rates.html: missing required visible provider credit link');
          }
          if (!chart.includes('id="search"') || !chart.includes('id="bars"') || !chart.includes('id="visitorLocalTime"')) {
            errors.push('currency-rates.html: missing search, chart, or local clock element');
          }
          if (!sitemap.includes('https://sabbir019109307.github.io/GlobalMoneyCalc/currency-rates.html')) {
            errors.push('sitemap.xml: missing currency-rates.html');
          }
          for (const file of required.filter((name) => name.endsWith('.html'))) {
            if (fs.existsSync(file) && !fs.readFileSync(file, 'utf8').includes('SABBIR AHMED TAHIR')) {
              errors.push(file + ': missing footer author credit');
            }
          }

          if (errors.length) {
            console.error(errors.join('\n'));
            process.exit(1);
          }
          console.log('Static page, metadata, internal link and inline JavaScript checks passed.');
          NODE

      - name: Validate XML sitemap
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('sitemap.xml is valid XML.')
          PY
