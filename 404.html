const selector=document.getElementById("languageSelect");
let lang=(function(){try{const saved=localStorage.getItem("gmc_language");return supported.includes(saved)?saved:"en"}catch(e){return "en"}})();
function setLang(){
 const item=messages[lang]||messages.en;
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 ["title","message","homeLink","backBtn","accountLink"].forEach((id,i)=>document.getElementById(id).textContent=item[i]);
 selector.value=lang;
 try{localStorage.setItem("gmc_language",lang)}catch(e){}
}
selector.addEventListener("change",()=>{if(supported.includes(selector.value)){lang=selector.value;setLang()}});
document.getElementById("backBtn").addEventListener("click",()=>history.length>1?history.back():location.assign("./"));
setLang();
</script>
<script>
(function(){
 const timeNode=document.getElementById("visitorLocalTime"),labelNode=document.getElementById("visitorLocalLabel"),zoneNode=document.getElementById("visitorTimeZone");
 if(!timeNode||!labelNode||!zoneNode)return;
 function updateVisitorClock(){
  const locale=(window.GMC_LOCALES||{})[lang]||"en-US";
  const label=((window.GMC_LANGUAGE_LABELS||{})[lang]||(window.GMC_LANGUAGE_LABELS||{}).en);
  const zone=Intl.DateTimeFormat().resolvedOptions().timeZone||"Local device time",now=new Date();
  timeNode.dateTime=now.toISOString();timeNode.textContent=new Intl.DateTimeFormat(locale,{dateStyle:"full",timeStyle:"medium"}).format(now);
  labelNode.textContent=label.time;zoneNode.textContent=label.zone+zone;
 }
 updateVisitorClock();window.setInterval(updateVisitorClock,1000);
 selector.addEventListener("change",updateVisitorClock);
})();
</script>
